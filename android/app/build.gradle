apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
// Credentials are read from android/keystore.properties (git-ignored) first,
// then from environment variables. If neither is present, `assembleRelease`
// falls back to an unsigned build so CI/dev machines don't break.
//   AXEN_KEYSTORE_FILE / AXEN_KEYSTORE_PASSWORD / AXEN_KEY_ALIAS / AXEN_KEY_PASSWORD (DWT_* still honoured)
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def signingValue = { String propKey, String envKey ->
    // AXEN_* is the current naming; DWT_* stays supported for existing setups.
    def legacyKey = envKey.replaceFirst(/^AXEN_/, "DWT_")
    return keystoreProps.getProperty(propKey) ?: System.getenv(envKey) ?: System.getenv(legacyKey)
}

def storeFilePath = signingValue("storeFile", "AXEN_KEYSTORE_FILE")
def storePasswordValue = signingValue("storePassword", "AXEN_KEYSTORE_PASSWORD")
def keyAliasValue = signingValue("keyAlias", "AXEN_KEY_ALIAS")
def keyPasswordValue = signingValue("keyPassword", "AXEN_KEY_PASSWORD")

def keystoreFileResolved = storeFilePath != null ? rootProject.file(storeFilePath) : null
def hasReleaseSigning = storeFilePath != null && storePasswordValue != null &&
        keyAliasValue != null && keyPasswordValue != null &&
        keystoreFileResolved != null && keystoreFileResolved.exists()

// Version: override per release with
//   ./gradlew bundleRelease -PaxenVersionCode=4 -PaxenVersionName=1.0.3
// or with the AXEN_VERSION_CODE / AXEN_VERSION_NAME env vars (CI).
def resolvedVersionCode = (project.findProperty("axenVersionCode")
        ?: project.findProperty("dwtVersionCode")
        ?: System.getenv("AXEN_VERSION_CODE") ?: "3").toString().toInteger()
def resolvedVersionName = (project.findProperty("axenVersionName")
        ?: project.findProperty("dwtVersionName")
        ?: System.getenv("AXEN_VERSION_NAME") ?: "1.0.2").toString()

// Play requires a signed AAB. Fail loudly instead of silently shipping an
// unsigned artifact, unless the build explicitly opts out.
def allowUnsignedRelease = project.hasProperty("allowUnsignedRelease")

android {
    namespace "com.hasin.axen"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hasin.axen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile keystoreFileResolved
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
    lint {
        checkReleaseBuilds false
    }
}

// Guard: any release assemble/bundle task must be signed.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name ==~ /(?i).*(assemble|bundle)Release.*/
    }
    if (releaseTask != null && !hasReleaseSigning) {
        if (allowUnsignedRelease) {
            logger.warn("[AXEN] No release signing config — producing an UNSIGNED release build.")
        } else {
            throw new GradleException(
                "\n\n[AXEN] Release signing is not configured — Google Play will reject an unsigned .aab.\n" +
                "Fix it from the PROJECT ROOT:\n" +
                "  AXEN_KEYSTORE_PASSWORD='your-password' AXEN_KEY_PASSWORD='your-password' npm run android:keystore\n" +
                "That creates android/axen-release.jks + android/keystore.properties.\n" +
                "Then re-run: npm run android:aab\n" +
                "(Use -PallowUnsignedRelease only for local smoke tests.)\n"
            )
        }
    } else if (releaseTask != null) {
        logger.lifecycle("[AXEN] Release signing OK — versionCode=${resolvedVersionCode}, versionName=${resolvedVersionName}")
    }
}



repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
