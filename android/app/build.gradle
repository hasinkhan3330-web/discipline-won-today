apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
// Credentials are read from android/keystore.properties (git-ignored) first,
// then from environment variables. If neither is present, `assembleRelease`
// falls back to an unsigned build so CI/dev machines don't break.
//   DWT_KEYSTORE_FILE / DWT_KEYSTORE_PASSWORD / DWT_KEY_ALIAS / DWT_KEY_PASSWORD
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def signingValue = { String propKey, String envKey ->
    return keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
}

def storeFilePath = signingValue("storeFile", "DWT_KEYSTORE_FILE")
def storePasswordValue = signingValue("storePassword", "DWT_KEYSTORE_PASSWORD")
def keyAliasValue = signingValue("keyAlias", "DWT_KEY_ALIAS")
def keyPasswordValue = signingValue("keyPassword", "DWT_KEY_PASSWORD")

def hasReleaseSigning = storeFilePath != null && storePasswordValue != null &&
        keyAliasValue != null && keyPasswordValue != null &&
        rootProject.file(storeFilePath).exists()

android {
    namespace "app.lovable.disciplinewontoday"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.lovable.disciplinewontoday"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty("dwtVersionCode") ? dwtVersionCode.toInteger() : 1
        versionName project.hasProperty("dwtVersionName") ? dwtVersionName : "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("[DWT] No release signing config found — producing an UNSIGNED release build. See ANDROID_BUILD.md")
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
